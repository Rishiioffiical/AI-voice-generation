    <script>
      (function () {
        var isExt = function (str) {
          return typeof str === 'string' && (str.indexOf('chrome-extension://') !== -1 || str.indexOf('moz-extension://') !== -1);
        };
        window.addEventListener(
          'error',
          function (e) {
            var stack = e && e.error && e.error.stack ? String(e.error.stack) : '';
            if (isExt(e && e.filename) || isExt(stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = e && e.reason;
            var stack = reason && reason.stack ? String(reason.stack) : String(reason || '');
            if (isExt(stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
